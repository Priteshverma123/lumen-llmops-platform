[project]
name = "lumen-sdk"
version = "0.1.0"
description = "Python SDK for Lumen: cached prompt fetching, experiment assignment, tracing helpers, embeddings"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "opentelemetry-api>=1.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumen_sdk"]
