[project]
name = "lumen"
version = "0.1.0"
description = "Lumen: LLMOps control plane (prompt registry + experiments, OTel-native LLM observability, embedding service)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "clickhouse-connect>=0.8",
    "minio>=7.2",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "numpy>=1.26",
    "opentelemetry-proto>=1.28",
    "protobuf>=5.28",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "sdk/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"bench/**" = ["S", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src/lumen/experiments", "src/lumen/telemetry", "src/lumen/pricing", "src/lumen/embeddings"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "sdk/python"]
markers = ["integration: needs the docker compose stack running"]
addopts = "-m 'not integration'"
