# Versioned embedding models. The id (name@version) is part of every cache key and is what
# vector stores should record next to each vector. Bump the version when weights change.
default: bge-small@1
models:
  - id: bge-small@1
    backend: tei
    upstream_model: BAAI/bge-small-en-v1.5
    url: http://tei-embed:80
    dim: 384
    max_tokens: 512
    query_prefix: "Represent this sentence for searching relevant passages: "
    aliases: [bge-small]
  - id: openai-te3-small@1
    backend: openai
    upstream_model: text-embedding-3-small
    url: https://api.openai.com/v1
    api_key_env: LUMEN_OPENAI_API_KEY
    dim: 1536
    max_tokens: 8191
    price_per_mtok: 0.02   # UNVERIFIED example price
